openapi: 3.0.3
info:
  title: Marketplace API
  version: 1.0.0
  description: Contract-first API for the SOA marketplace homework.
servers:
  - url: http://localhost:8001
security:
  - bearerAuth: []
x-error-codes:
  PRODUCT_NOT_FOUND: 404
  PRODUCT_INACTIVE: 409
  ORDER_NOT_FOUND: 404
  ORDER_LIMIT_EXCEEDED: 429
  ORDER_HAS_ACTIVE: 409
  INVALID_STATE_TRANSITION: 409
  INSUFFICIENT_STOCK: 409
  PROMO_CODE_INVALID: 422
  PROMO_CODE_MIN_AMOUNT: 422
  ORDER_OWNERSHIP_VIOLATION: 403
  VALIDATION_ERROR: 400
  TOKEN_EXPIRED: 401
  TOKEN_INVALID: 401
  REFRESH_TOKEN_INVALID: 401
  ACCESS_DENIED: 403
paths:
  /health:
    get:
      operationId: health
      summary: Liveness check
      security: []
      responses:
        '200':
          description: Service is running
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
  /auth/register:
    post:
      operationId: register
      summary: Register USER or SELLER; ADMIN is provisioned by the operator
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Registered user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        default: { $ref: '#/components/responses/Error' }
  /auth/login:
    post:
      operationId: login
      summary: Authenticate and issue access and refresh tokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Token pair
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        default: { $ref: '#/components/responses/Error' }
  /auth/refresh:
    post:
      operationId: refresh
      summary: Exchange a valid refresh token for a new access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: New token pair
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        default: { $ref: '#/components/responses/Error' }
  /products:
    get:
      operationId: list_products
      summary: List products with zero-based pagination and exact filters
      description: Roles USER, SELLER, ADMIN. All statuses are visible; filter to ACTIVE for saleable products.
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ProductStatus' }
        - name: category
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Page of products
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductPage' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: create_product
      summary: Create product
      description: SELLER creates only own products; ADMIN may set seller_id.
      x-roles: [SELLER, ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductCreate' }
      responses:
        '201':
          description: Created product
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductResponse' }
        default: { $ref: '#/components/responses/Error' }
  /products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: get_product
      summary: Read product
      description: Roles USER, SELLER, ADMIN.
      responses:
        '200':
          description: Product
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductResponse' }
        default: { $ref: '#/components/responses/Error' }
    put:
      operationId: update_product
      summary: Replace product fields
      description: SELLER can update only own products; ADMIN can update any product.
      x-roles: [SELLER, ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductUpdate' }
      responses:
        '200':
          description: Updated product
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductResponse' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: delete_product
      summary: Soft delete by setting status to ARCHIVED
      description: SELLER can archive only own products; ADMIN can archive any product.
      x-roles: [SELLER, ADMIN]
      responses:
        '200':
          description: Archived product
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductResponse' }
        default: { $ref: '#/components/responses/Error' }
  /orders:
    post:
      operationId: create_order
      summary: Create and atomically reserve an order
      description: USER or ADMIN. All stock, promo and order writes are one transaction.
      x-roles: [USER, ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderCreate' }
      responses:
        '201':
          description: Created order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        default: { $ref: '#/components/responses/Error' }
  /orders/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: get_order
      summary: Read own order, or any order as ADMIN
      x-roles: [USER, ADMIN]
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        default: { $ref: '#/components/responses/Error' }
    put:
      operationId: update_order
      summary: Replace order items while in CREATED state
      x-roles: [USER, ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderUpdate' }
      responses:
        '200':
          description: Updated order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        default: { $ref: '#/components/responses/Error' }
  /orders/{id}/cancel:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: cancel_order
      summary: Cancel an own order from CREATED or PAYMENT_PENDING
      x-roles: [USER, ADMIN]
      responses:
        '200':
          description: Canceled order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        default: { $ref: '#/components/responses/Error' }
  /orders/{id}/transition:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: transition_order
      summary: Demo payment and shipping state transitions
      description: ADMIN only. CREATED -> PAYMENT_PENDING -> PAID -> SHIPPED -> COMPLETED.
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransitionRequest' }
      responses:
        '200':
          description: Updated order state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        default: { $ref: '#/components/responses/Error' }
  /promo-codes:
    post:
      operationId: create_promo_code
      summary: Create a promo code
      description: SELLER or ADMIN.
      x-roles: [SELLER, ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PromoCodeCreate' }
      responses:
        '201':
          description: Created promo code
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PromoCodeResponse' }
        default: { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Error:
      description: ErrorResponse with an error_code from the documented x-error-codes catalog
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    ProductStatus:
      type: string
      enum: [ACTIVE, INACTIVE, ARCHIVED]
    OrderStatus:
      type: string
      enum: [CREATED, PAYMENT_PENDING, PAID, SHIPPED, COMPLETED, CANCELED]
    DiscountType:
      type: string
      enum: [PERCENTAGE, FIXED_AMOUNT]
    Role:
      type: string
      enum: [USER, SELLER, ADMIN]
    HealthResponse:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok] }
    RegisterRequest:
      type: object
      required: [email, password, role]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        password: { type: string, minLength: 8, maxLength: 128 }
        role: { type: string, enum: [USER, SELLER] }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }
    UserResponse:
      type: object
      required: [id, email, role]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
    TokenPair:
      type: object
      required: [access_token, refresh_token, token_type]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, enum: [bearer] }
    ProductCreate:
      type: object
      required: [name, price, stock, category, status]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        description: { type: string, maxLength: 4000, nullable: true }
        price: { type: number, format: decimal, minimum: 0.01, multipleOf: 0.01 }
        stock: { type: integer, minimum: 0 }
        category: { type: string, minLength: 1, maxLength: 100 }
        status: { $ref: '#/components/schemas/ProductStatus' }
        seller_id: { type: string, format: uuid, nullable: true, description: ADMIN may choose a seller; SELLER uses their own ID }
    ProductUpdate:
      type: object
      required: [name, price, stock, category, status]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        description: { type: string, maxLength: 4000, nullable: true }
        price: { type: number, format: decimal, minimum: 0.01, multipleOf: 0.01 }
        stock: { type: integer, minimum: 0 }
        category: { type: string, minLength: 1, maxLength: 100 }
        status: { $ref: '#/components/schemas/ProductStatus' }
    ProductResponse:
      type: object
      required: [id, name, price, stock, category, status, seller_id, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        price: { type: string, format: decimal }
        stock: { type: integer }
        category: { type: string }
        status: { $ref: '#/components/schemas/ProductStatus' }
        seller_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ProductPage:
      type: object
      required: [items, totalElements, page, size]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ProductResponse' }
        totalElements: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1 }
    OrderItemInput:
      type: object
      required: [product_id, quantity]
      properties:
        product_id: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, maximum: 999 }
    OrderCreate:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: '#/components/schemas/OrderItemInput' }
        promo_code: { type: string, nullable: true, pattern: '^[A-Z0-9_]{4,20}$' }
    OrderUpdate:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: '#/components/schemas/OrderItemInput' }
    OrderItemResponse:
      type: object
      required: [id, product_id, quantity, price_at_order]
      properties:
        id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        quantity: { type: integer }
        price_at_order: { type: string, format: decimal }
    OrderResponse:
      type: object
      required: [id, user_id, status, total_amount, discount_amount, items, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/OrderStatus' }
        promo_code_id: { type: string, format: uuid, nullable: true }
        total_amount: { type: string, format: decimal }
        discount_amount: { type: string, format: decimal }
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderItemResponse' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PromoCodeCreate:
      type: object
      required: [code, discount_type, discount_value, min_order_amount, max_uses, valid_from, valid_until]
      properties:
        code: { type: string, pattern: '^[A-Z0-9_]{4,20}$' }
        discount_type: { $ref: '#/components/schemas/DiscountType' }
        discount_value: { type: number, format: decimal, minimum: 0.01, multipleOf: 0.01 }
        min_order_amount: { type: number, format: decimal, minimum: 0 }
        max_uses: { type: integer, minimum: 1 }
        valid_from: { type: string, format: date-time }
        valid_until: { type: string, format: date-time }
        active: { type: boolean, default: true }
    PromoCodeResponse:
      type: object
      required: [id, code, discount_type, discount_value, min_order_amount, max_uses, current_uses, valid_from, valid_until, active]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        discount_type: { $ref: '#/components/schemas/DiscountType' }
        discount_value: { type: string, format: decimal }
        min_order_amount: { type: string, format: decimal }
        max_uses: { type: integer }
        current_uses: { type: integer }
        valid_from: { type: string, format: date-time }
        valid_until: { type: string, format: date-time }
        active: { type: boolean }
    TransitionRequest:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/OrderStatus' }
    ErrorResponse:
      type: object
      required: [error_code, message]
      properties:
        error_code: { type: string, enum: [PRODUCT_NOT_FOUND, PRODUCT_INACTIVE, ORDER_NOT_FOUND, ORDER_LIMIT_EXCEEDED, ORDER_HAS_ACTIVE, INVALID_STATE_TRANSITION, INSUFFICIENT_STOCK, PROMO_CODE_INVALID, PROMO_CODE_MIN_AMOUNT, ORDER_OWNERSHIP_VIOLATION, VALIDATION_ERROR, TOKEN_EXPIRED, TOKEN_INVALID, REFRESH_TOKEN_INVALID, ACCESS_DENIED] }
        message: { type: string }
        details: { type: object, nullable: true, additionalProperties: true }
